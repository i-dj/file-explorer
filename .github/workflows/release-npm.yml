name: Release NPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version to publish, for example v1.2.3. Leave empty to auto-increment the latest npm patch version."
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  PACKAGE_DIR: packages/file-explorer
  PACKAGE_NAME: "@nextdj/file-explorer"

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          INPUT_VERSION="${{ inputs.version || '' }}"
          VERSION=""
          CREATE_TAG="false"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            CREATE_TAG="true"
          else
            LATEST_NPM_VERSION="$(npm view "$PACKAGE_NAME" version 2>/dev/null || true)"
            if [ -n "$LATEST_NPM_VERSION" ]; then
              RAW="$LATEST_NPM_VERSION"
            else
              RAW="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW"
            PATCH=$((PATCH + 1))
            VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            CREATE_TAG="true"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match vMAJOR.MINOR.PATCH, got: $VERSION" >&2
            exit 1
          fi

          PACKAGE_VERSION="${VERSION#v}"

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published on npm." >&2
            exit 1
          fi

          if [ "$CREATE_TAG" = "true" ] && git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. Choose a different version or leave the input empty." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "create_tag=$CREATE_TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package version
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const path = "packages/file-explorer/package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.version = process.env.PACKAGE_VERSION;
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
        env:
          PACKAGE_VERSION: ${{ steps.vars.outputs.package_version }}

      - name: Typecheck
        run: pnpm --filter "$PACKAGE_NAME" typecheck

      - name: Build
        run: pnpm --filter "$PACKAGE_NAME" build

      - name: Pack dry run
        working-directory: packages/file-explorer
        run: pnpm pack --dry-run

      - name: Commit release version
        if: steps.vars.outputs.create_tag == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PACKAGE_DIR/package.json"
          git commit -m "chore: release ${{ steps.vars.outputs.version }} [skip ci]"
          git tag "${{ steps.vars.outputs.version }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${{ steps.vars.outputs.version }}"

      - name: Publish to npm
        shell: bash
        working-directory: packages/file-explorer
        run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
